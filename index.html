<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fly Boutique Perú</title>
    <style>html,body{background:#fff;margin:0}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear: la app se ve al instante y las letras se cambian solas al llegar -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,700;0,800;0,900&family=Jost:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <meta name="description" content="Fly Boutique Perú: moda femenina elegante. Compra online con envío a todo el Perú o recoge en tienda." />
    <meta name="theme-color" content="#000000" />
    <!-- Dos apps instalables (tienda «Fly» y «Fly Staff»; /caja abre «Fly Staff» en la caja): el manifiesto correcto se elige aquí, mientras se lee
         la página, porque el iPhone toma la dirección de inicio del manifiesto que encuentra al cargar.
         Si la app instalada de staff/caja se abre en «/» (instalada antes de este arreglo), vuelve sola a su pantalla. -->
    <script>
      (function () {
        var app = "", p = location.pathname.toLowerCase().replace(/\/+$/, ""), h = location.hash;
        try {
          var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
          var home = standalone ? localStorage.getItem("fly:homeApp") : null;
          if ((p === "" || p === "/") && !h && (home === "staff" || home === "caja")) { history.replaceState(null, "", home === "caja" ? "/#caja" : "/#staff"); h = location.hash; }
        } catch (e) {}
        if (p === "/caja" || h === "#caja" || p === "/staff" || p.indexOf("/staff/") === 0 || h.indexOf("#staff") === 0) app = "staff";
        window.__flyBootApp = app;
        var d = document;
        d.write('<link rel="manifest" href="/manifest' + (app ? "-" + app : "") + '.webmanifest" />');
        d.write('<link rel="apple-touch-icon" href="/icons/' + (app ? app + "-" : "") + 'apple-touch-icon.png" />');
        d.write('<meta name="apple-mobile-web-app-title" content="' + (app === "staff" ? "Fly Staff" : "Fly") + '" />');
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta property="og:site_name" content="Fly Boutique Perú" />
    <meta property="og:title" content="Fly Boutique Perú" />
    <meta property="og:description" content="Moda femenina elegante. Envíos a todo el Perú." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
  </head>
  <body style="margin:0;background:#fff;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
